; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; One project, three firmwares. Pick one with the environment selector in the
; PlatformIO status bar, or on the command line:
;   pio run -e rov -t upload             ESP32-S3 PowerFeather inside the ROV
;   pio run -e station -t upload         Arduino Uno surface station
;   pio run -e thruster_test -t upload   Arduino Mega single-thruster bench test

[platformio]
default_envs = rov, station

[env]
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
build_unflags = -std=gnu++11
build_flags = -Wall

[env:rov]
platform = espressif32
board = esp32s3_powerfeather
build_src_filter = +<rov/>
build_unflags = -std=gnu++11 -std=gnu++2b
build_flags =
    ${env.build_flags}
    -std=gnu++17
    ; 1 = out of water: outputs limited to 15 %, runs cut after 10 s.
    ; Set to 0 when the ROV is in the water.
    -DROV_OUT_OF_WATER=1
lib_deps =
    powerfeather/PowerFeather-SDK@^2.1.4
monitor_filters = esp32_exception_decoder, send_on_enter

[env:station]
platform = atmelavr
board = uno
build_src_filter = +<station/>
build_flags =
    ${env.build_flags}
    -std=gnu++17
    ; 1 = analog joysticks + buttons, 0 = drive from the serial console only.
    -DSTATION_USE_JOYSTICKS=1
lib_deps =
    autowp/autowp-mcp2515@^1.3.1

[env:thruster_test]
platform = atmelavr
board = megaatmega2560
build_src_filter = +<thruster_test/>
build_flags =
    ${env.build_flags}
    -std=gnu++17
lib_deps =
    arduino-libraries/Servo

; Host unit tests for the hardware-free libraries:  pio test -e native
[env:native]
platform = native
framework =
build_src_filter = -<*>
build_flags = -std=gnu++17 -Wall
lib_compat_mode = off
lib_ignore = Thruster, Mpu6050
test_framework = unity
